name: insyvera
x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://insyvera:${POSTGRES_PASSWORD:?Run bootstrap.ps1 first}@postgres:5432/insyvera
  DATA_DIR: /app/data
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-insyvera}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run bootstrap.ps1 first}
  TASK_ALWAYS_EAGER: "false"
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-5180},http://127.0.0.1:${WEB_PORT:-5180},http://localhost:${APP_PORT:-8100},http://127.0.0.1:${APP_PORT:-8100}
  MODEL_PROVIDER: ${MODEL_PROVIDER:-extractive}
  MODEL_ID: ${MODEL_ID:-qwen3:8b}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-lexical}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_URL: ${OPENAI_URL:-https://api.openai.com/v1}
  ALLOW_EXTERNAL_WEB: ${ALLOW_EXTERNAL_WEB:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: insyvera
      POSTGRES_USER: insyvera
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bootstrap.ps1 first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insyvera -d insyvera"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    build: {context: ., dockerfile: infrastructure/docker/minio.Dockerfile}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-insyvera}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run bootstrap.ps1 first}
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  api:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    environment: *app-environment
    ports: ["127.0.0.1:${APP_PORT:-8100}:8100"]
    volumes: [app_data:/app/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/api/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: infrastructure/docker/api.Dockerfile}
    command: ["python", "-m", "celery", "-A", "app.jobs.celery", "worker", "--loglevel=info", "--concurrency=2", "--beat", "--schedule=/app/data/beat-schedule"]
    environment: *app-environment
    volumes: [app_data:/app/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 2G, cpus: "2"}}}
    restart: unless-stopped
  web:
    build: {context: ., dockerfile: infrastructure/docker/web.Dockerfile}
    ports: ["127.0.0.1:${WEB_PORT:-5180}:8080"]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  ollama:
    profiles: [inference]
    image: ollama/ollama:0.12.6
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped
  telemetry:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.136.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infrastructure/observability/otel.yaml:/etc/otel/config.yaml:ro"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
  app_data:
  ollama_data:
