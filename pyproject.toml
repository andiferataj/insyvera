[project]
name = "insyvera"
version = "0.1.0"
description = "Agentic research and data intelligence with inspectable evidence"
requires-python = ">=3.12,<3.14"
dependencies = [
 "fastapi==0.162.0", "uvicorn[standard]>=0.35,<1", "python-multipart>=0.0.20,<1",
 "sqlalchemy>=2.0.43,<2.1", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4",
 "pgvector>=0.4,<1", "celery[redis]>=5.5,<6", "boto3>=1.40,<2",
 "pandas>=2.3,<3", "numpy>=2.2,<3", "openpyxl>=3.1.5,<4",
 "pymupdf>=1.26,<2", "python-docx>=1.2,<2", "scipy>=1.16,<2",
 "statsmodels>=0.14,<1", "plotly>=6.3,<7", "httpx>=0.28,<1",
 "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
 "opentelemetry-api>=1.36,<2", "opentelemetry-sdk>=1.36,<2",
 "opentelemetry-exporter-otlp-proto-http>=1.36,<2", "reportlab>=4.4,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
